{{- if .Values.wssIngress.enabled }}
{{- $fullName := include "nurix-service.serviceName" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nurix-service.fullname" . }}-wss
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "nurix-service.labels" . | nindent 4 }}
  annotations:
{{- if not .Values.wssIngress.ingressClassName }}
    kubernetes.io/ingress.class: "alb"
{{- end }}
    alb.ingress.kubernetes.io/group.name: "wss-{{ .Values.global.regionCode }}-{{ .Values.global.environment }}-eks-alb-ext"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "{{ .Values.wssIngress.healthcheckIntervalSeconds }}"
    alb.ingress.kubernetes.io/healthcheck-path: "{{ .Values.wssIngress.healthcheckPath }}"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "{{ .Values.wssIngress.healthcheckTimeoutSeconds }}"
    alb.ingress.kubernetes.io/healthy-threshold-count: "{{ .Values.wssIngress.healthyThresholdCount }}"
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.wssIngress.listenPorts | quote }}
    alb.ingress.kubernetes.io/load-balancer-name: "wss-{{ .Values.global.regionCode }}-{{ .Values.global.environment }}-eks-alb-ext"
    alb.ingress.kubernetes.io/scheme: "{{ .Values.wssIngress.scheme }}"
    alb.ingress.kubernetes.io/target-type: "{{ .Values.wssIngress.targetType }}"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "{{ .Values.wssIngress.unhealthyThresholdCount }}"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/certificate-arn: "{{ include "nurix-service.albCertArn" . }}"
  {{- with .Values.wssIngress.additionalAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.wssIngress.ingressClassName }}
  ingressClassName: {{ .Values.wssIngress.ingressClassName }}
  {{- end }}
  {{- if .Values.wssIngress.tls }}
  tls:
    {{- range .Values.wssIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.wssIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- else }}
            pathType: Prefix
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
