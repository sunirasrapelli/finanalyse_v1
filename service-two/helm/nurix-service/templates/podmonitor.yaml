{{- if and .Values.podMonitor.enabled .Values.service.enabled }}
{{- $serviceNamespace := default .Release.Namespace .Values.namespace.name }}
{{- $monitorNamespace := default $serviceNamespace .Values.podMonitor.namespace }}
{{- $defaultMonitorName := printf "%s-podmonitor" (include "nurix-service.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ default $defaultMonitorName .Values.podMonitor.name }}
  namespace: {{ $monitorNamespace }}
  labels:
    {{- include "nurix-service.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.podMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.podMonitor.namespaceSelector }}
  namespaceSelector:
{{ toYaml .Values.podMonitor.namespaceSelector | nindent 4 }}
  {{- else }}
  namespaceSelector:
    matchNames:
      - {{ $serviceNamespace }}
  {{- end }}
  {{- if .Values.podMonitor.podMetricsEndpoints }}
  podMetricsEndpoints:
{{ toYaml .Values.podMonitor.podMetricsEndpoints | nindent 4 }}
  {{- else }}
  podMetricsEndpoints:
    - port: {{ .Values.podMonitor.port | default "metrics" }}
      {{- with .Values.podMonitor.path }}
      path: {{ . }}
      {{- end }}
      {{- with .Values.podMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.podMonitor.scheme }}
      scheme: {{ . }}
      {{- end }}
      {{- if hasKey .Values.podMonitor "honorLabels" }}
      honorLabels: {{ .Values.podMonitor.honorLabels }}
      {{- end }}
      {{- with .Values.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nurix-service.selectorLabels" . | nindent 6 }}
{{- end }}

