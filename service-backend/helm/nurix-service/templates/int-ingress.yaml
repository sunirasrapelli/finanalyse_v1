{{- if .Values.internalIngress.enabled }}
{{- $fullName := include "nurix-service.serviceName" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nurix-service.fullname" . }}-int
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "nurix-service.labels" . | nindent 4 }}
  annotations:
{{- if not .Values.internalIngress.ingressClassName }}
    kubernetes.io/ingress.class: "alb"
{{- end }}
    alb.ingress.kubernetes.io/group.name: "{{ .Values.global.regionCode }}-{{ .Values.global.environment }}-eks-alb-int"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "{{ .Values.internalIngress.healthcheckIntervalSeconds }}"
    alb.ingress.kubernetes.io/healthcheck-path: "{{ .Values.internalIngress.healthcheckPath }}"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "{{ .Values.internalIngress.healthcheckTimeoutSeconds }}"
    alb.ingress.kubernetes.io/healthy-threshold-count: "{{ .Values.internalIngress.healthyThresholdCount }}"
    alb.ingress.kubernetes.io/listen-ports: {{ .Values.internalIngress.listenPorts | quote }}
    alb.ingress.kubernetes.io/load-balancer-name: "{{ .Values.global.regionCode }}-{{ .Values.global.environment }}-eks-alb-int"
    alb.ingress.kubernetes.io/scheme: "internal"
    alb.ingress.kubernetes.io/target-type: "{{ .Values.internalIngress.targetType }}"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "{{ .Values.internalIngress.unhealthyThresholdCount }}"
    alb.ingress.kubernetes.io/certificate-arn: "{{ include "nurix-service.albCertArn" . }}"
  {{- with .Values.internalIngress.additionalAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.internalIngress.ingressClassName }}
  ingressClassName: {{ .Values.internalIngress.ingressClassName }}
  {{- end }}
  {{- if .Values.internalIngress.tls }}
  tls:
    {{- range .Values.internalIngress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.internalIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- else }}
            pathType: Prefix
            {{- end }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
