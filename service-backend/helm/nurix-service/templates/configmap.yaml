{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nurix-service.configMapName" . }}
  namespace: {{ .Values.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "nurix-service.labels" . | nindent 4 }}
  # annotations:
  #   helm.sh/hook: pre-install,pre-upgrade
  #   helm.sh/hook-weight: "-11"
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Default environment variables
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  AWS_REGION: {{ .Values.global.aws.region | quote }}
  {{- if .Values.application.python.path }}
  PYTHONPATH: {{ .Values.application.python.path | quote }}
  {{- end }}
{{- end }}
